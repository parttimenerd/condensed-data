name: ci

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'pom.xml'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'pom.xml'
      - '.github/workflows/ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5

    - name: Set up JDK 17 (required by JMC toolchain)
      uses: actions/setup-java@v5
      with:
        java-version: 17
        distribution: 'sapmachine'

    - name: Set up JDK 21 (primary)
      uses: actions/setup-java@v5
      with:
        java-version: 21
        distribution: 'sapmachine'
        cache: maven

    - name: Cache femtocli
      id: cache-femtocli
      uses: actions/cache@v4
      with:
        path: ~/.m2/repository/me/bechberger/util/femtocli
        key: femtocli-${{ hashFiles('**/femtocli/**') }}-v1
        restore-keys: femtocli-

    - name: Install femtocli
      if: steps.cache-femtocli.outputs.cache-hit != 'true'
      run: |
        git clone --depth=1 https://github.com/parttimenerd/femtocli.git /tmp/femtocli
        cd /tmp/femtocli && mvn install -Pminimal -DskipTests -q

    - name: Get JMC HEAD SHA
      id: jmc-sha
      run: |
        echo "sha=$(git ls-remote https://github.com/parttimenerd/jmc.git refs/heads/sap | cut -f1 | head -c12)" >> "$GITHUB_OUTPUT"

    - name: Cache JMC core
      id: cache-jmc
      uses: actions/cache@v4
      with:
        path: ~/.m2/repository/org/openjdk/jmc
        key: jmc-core-${{ steps.jmc-sha.outputs.sha }}

    - name: Install JMC core (SNAPSHOT)
      if: steps.cache-jmc.outputs.cache-hit != 'true'
      run: |
        git clone --depth=1 --branch sap https://github.com/parttimenerd/jmc.git /tmp/jmc
        cd /tmp/jmc/core && mvn install -DskipTests -Dmaven.javadoc.skip=true -q

    - name: Run tests
      run: mvn clean test

    - name: Run spotless check
      run: mvn spotless:check

  package:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5

    - name: Set up JDK 21 (primary)
      uses: actions/setup-java@v5
      with:
        java-version: 21
        distribution: 'sapmachine'
        cache: maven

    - name: Cache femtocli
      id: cache-femtocli
      uses: actions/cache@v4
      with:
        path: ~/.m2/repository/me/bechberger/util/femtocli
        key: femtocli-${{ hashFiles('**/femtocli/**') }}-v1
        restore-keys: femtocli-

    - name: Install femtocli
      if: steps.cache-femtocli.outputs.cache-hit != 'true'
      run: |
        git clone --depth=1 https://github.com/parttimenerd/femtocli.git /tmp/femtocli
        cd /tmp/femtocli && mvn install -Pminimal -DskipTests -q

    - name: Build package
      run: mvn package -Dmaven.test.skip=true -DskipTests=true -P!jmc-test

    - name: Generate femtojar-reencoded JARs
      run: python3 reduce-jar.py femtojar target/condensed-data.jar target/femtojar-jars/

    - name: Generate platform-specific JARs
      run: |
        python3 reduce-jar.py matrix \
          target/condensed-data.jar \
          target/platform-jars/ \
          --with-minimal \
          --minimal-output-dir target/platform-jars-minimal/

    - name: Update JAR size numbers in docs
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      continue-on-error: true
      run: |
        python3 update-jar-sizes.py
        if ! git diff --quiet docs/jar-releases.md; then
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/jar-releases.md
          git commit -m "docs: auto-update JAR size numbers [skip ci]"
          git push
        fi

    - name: Upload main JAR
      uses: actions/upload-artifact@v6
      with:
        name: condensed-data.jar
        path: target/condensed-data.jar
        retention-days: 30

    - name: Upload femtojar JARs
      uses: actions/upload-artifact@v6
      with:
        name: femtojar-jars
        path: target/femtojar-jars/
        retention-days: 30

    - name: Upload platform JARs
      uses: actions/upload-artifact@v6
      with:
        name: platform-jars
        path: target/platform-jars/
        retention-days: 30

    - name: Upload minimal platform JARs
      uses: actions/upload-artifact@v6
      with:
        name: platform-jars-minimal
        path: target/platform-jars-minimal/
        retention-days: 30

  # Rolling prerelease: keeps a single `latest` GitHub release always built from the
  # newest commit on main. action-gh-release moves the `latest` tag to the current commit
  # and replaces the release assets, so no stale prereleases accumulate.
  snapshot-release:
    needs: [test, package]
    runs-on: ubuntu-latest
    if: github.repository == 'parttimenerd/condensed-data' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write

    steps:
    - name: Download main JAR
      uses: actions/download-artifact@v4
      with:
        name: condensed-data.jar
        path: target/

    - name: Download platform JARs
      uses: actions/download-artifact@v4
      with:
        name: platform-jars
        path: target/platform-jars/

    - name: Download minimal platform JARs
      uses: actions/download-artifact@v4
      with:
        name: platform-jars-minimal
        path: target/platform-jars-minimal/

    # Delete and recreate the rolling release each time so GitHub shows the current
    # "released X ago" timestamp rather than the original creation date.
    - name: Publish rolling latest release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        cat > /tmp/release-notes.md << 'EOF'
        Rolling development build from `main`.

        ⚠️ Prerelease — may be unstable.

        ```bash
        java -jar condensed-data.jar --help
        ```

        Platform-specific JARs are smaller variants that bundle native libraries for a single OS/architecture.
        EOF
        gh release delete latest --yes --repo ${{ github.repository }} 2>/dev/null || true
        gh release create latest \
          --repo ${{ github.repository }} \
          --title "Latest build" \
          --notes-file /tmp/release-notes.md \
          --prerelease \
          --target ${{ github.sha }} \
          target/condensed-data.jar \
          target/platform-jars/*.jar \
          target/platform-jars-minimal/*.jar
